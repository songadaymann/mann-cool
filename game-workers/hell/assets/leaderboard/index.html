<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lindsay Graham In Hell — Leaderboard</title>
  <style>
    @font-face{font-family:Hell;src:url(./Planes_ValMore.ttf)}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff0b4;background:#3b110d url(./backgrounds/00_background.png) center/cover fixed;font-family:Hell,monospace;padding:clamp(20px,5vw,64px)}main{max-width:760px;margin:auto;background:#101518e8;border:3px solid #ff9f43;padding:clamp(18px,4vw,42px);box-shadow:10px 10px 0 #190805}h1{font-size:clamp(28px,7vw,64px);line-height:.92;margin:0 0 12px;color:#ffd166;text-transform:uppercase}p,a{color:#fff0b4}ol{list-style:none;padding:0;margin:32px 0;display:grid;gap:8px}li{display:grid;grid-template-columns:42px 1fr auto;gap:12px;padding:14px;background:#3b110dcc;border:1px solid #ff9f43}.rank{color:#ff9f43}.score{text-align:right}.muted{opacity:.7}a{display:inline-block;margin-top:12px}
  </style>
</head>
<body><main><h1>Lindsay Graham<br>In Hell</h1><p>Global leaderboard — completion first, then fastest time.</p><ol id="scores"><li class="muted">Loading scores…</li></ol><a href="/hell/">← Play the game</a></main>
<script>
const gameId='c94911d4-78b1-495e-aa99-2bf28b375741';
const formatTime=(ms)=>`${Math.floor(ms/60000)}:${String(Math.floor(ms/1000)%60).padStart(2,'0')}.${String(ms%1000).padStart(3,'0')}`;
fetch(`/hell/api/leaderboard?gameId=${gameId}&limit=all`).then(r=>r.json()).then(({entries=[]})=>{const list=document.querySelector('#scores');list.replaceChildren();if(!entries.length){list.innerHTML='<li class="muted">No completed runs yet.</li>';return}entries.forEach((entry,index)=>{const li=document.createElement('li');const rank=document.createElement('span');const name=document.createElement('strong');const score=document.createElement('span');rank.className='rank';score.className='score';rank.textContent=`#${index+1}`;name.textContent=entry.playerName;score.textContent=`${entry.completionPercent}% · ${formatTime(entry.timeMs)}`;li.append(rank,name,score);list.append(li)})}).catch(()=>{document.querySelector('#scores').innerHTML='<li class="muted">Leaderboard unavailable.</li>'});
</script></body></html>
