<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sled Launch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredericka+the+Great&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Fredericka the Great', cursive;
        }

        #gameCanvas {
            display: block;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 32px;
            pointer-events: none;
        }

        #instructions {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            font-size: 18px;
            text-align: right;
            line-height: 1.6;
        }

        #buttons {
            position: absolute;
            top: 60px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .btn {
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            padding: 10px 20px;
            font-size: 18px;
            font-family: 'Fredericka the Great', cursive;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #fff;
            color: #000;
        }

        #muteBtn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            padding: 10px 15px;
            font-size: 18px;
            font-family: 'Fredericka the Great', cursive;
            cursor: pointer;
            transition: all 0.2s;
        }

        #muteBtn:hover {
            background: #fff;
            color: #000;
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #000;
            border: 2px solid #fff;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            margin: 0 0 20px 0;
            text-align: center;
            font-size: 28px;
            color: #fff;
        }

        .modal-content .close-btn {
            float: right;
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            margin-top: -10px;
        }

        .leaderboard-list {
            list-style: none;
            padding: 0;
            margin: 0;
            color: #fff;
        }

        .leaderboard-list li {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #333;
            color: #fff;
        }

        .leaderboard-list .rank {
            width: 30px;
        }

        .leaderboard-list .name {
            flex: 1;
            margin: 0 10px;
        }

        .leaderboard-list .score {
            text-align: right;
        }

        /* Name input form */
        #nameForm {
            margin-top: 20px;
            text-align: center;
            color: #fff;
        }

        #nameForm input {
            background: #000;
            border: 2px solid #fff;
            color: #fff;
            padding: 10px;
            font-family: 'Fredericka the Great', cursive;
            font-size: 16px;
            width: 100%;
            margin-bottom: 10px;
        }

        #nameForm button {
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            padding: 10px 20px;
            font-family: 'Fredericka the Great', cursive;
            font-size: 16px;
            cursor: pointer;
        }

        #nameForm button:hover {
            background: #fff;
            color: #000;
        }
    </style>
</head>
<body>
    <audio id="bgMusic" loop>
        <source src="assets/1819.mp3" type="audio/mpeg">
    </audio>
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
        <div id="distance">0m</div>
    </div>
    <div id="instructions">
        <span id="phase-text">Draw your hill on the right →</span>
    </div>
    <div id="buttons">
        <button class="btn" id="resetBtn">Reset</button>
        <button class="btn" id="launchBtn">Launch!</button>
        <button class="btn" id="leaderboardBtn">Leaderboard</button>
    </div>
    <button id="muteBtn">Mute</button>

    <!-- Leaderboard Modal -->
    <div id="leaderboardModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" id="closeModal">&times;</button>
            <h2>Leaderboard</h2>
            <ul class="leaderboard-list" id="leaderboardList">
                <li>Loading...</li>
            </ul>
            <div id="nameForm" style="display: none;">
                <p id="yourScore"></p>
                <input type="text" id="playerName" placeholder="Enter your name" maxlength="20">
                <button id="submitScore">Submit Score</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
